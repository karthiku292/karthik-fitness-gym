# Keeps the Render free-tier web service awake so the public link opens
# directly instead of showing Render's "waking up" page. Pings the health
# endpoint every 5 minutes. Free: GitHub Actions is unlimited for public repos.
name: Keep app awake
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}      # lets you run it manually from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: curl -fsS --max-time 60 https://karthik-fitness-gym.onrender.com/health || true
