# Production stack for a Linux VM reachable by PUBLIC IP (no domain, HTTP).
# The frontend (nginx) is published on port 80 and proxies /api to the backend.
# Postgres stays private inside the Docker network.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.ip.yml --env-file deploy/.env.ip up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${PUBLIC_URL}
      BOOTSTRAP_GYM_NAME: ${BOOTSTRAP_GYM_NAME}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "80:5173"      # public site on http://<instance-ip>
    depends_on:
      - backend

volumes:
  pgdata:
